<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — Milk → Curd</title>
  <script src="../../shell.js"></script>
</head>
<body data-page="journeys/milk-to-curd" data-status="review">

<div class="stage">
  <div class="phone">
    <div class="screen">
<c-site-nav active="none" size="regular"></c-site-nav>

<section class="mx-auto max-w-3xl px-5 pt-8 pb-4">
  <c-back-pill back="milk.html" label="Milk journey"></c-back-pill>
  <c-transform-hero arrow="text" from="🥛" to="🍶" tint="plain" kicker="Milk → curd (dahi)" heading="Set curd overnight." lede="Warm milk + a spoon of live culture + a warm spot to sleep. That's it."></c-transform-hero>
</section>

<section class="mx-auto max-w-3xl px-5 py-4">
  <div class="grid grid-cols-4 gap-2">
    <c-stat label="Time" value="6–10 hr" tone="plain"></c-stat>
    <c-stat label="Hands-on" value="5 min" tone="plain"></c-stat>
    <c-stat label="Difficulty" value="Easy" tone="plain"></c-stat>
    <c-stat label="Skill" value="Learning ⌛" tone="highlight"></c-stat>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6">
  <p class="eyebrow">What you need</p>
  <div class="mt-4 grid gap-3 sm:grid-cols-3">
    <c-item-card glyph="🥛" name="Whole milk" amount="500 ml"></c-item-card>
    <c-item-card glyph="🥄" name="Live curd" amount="1 tbsp starter"></c-item-card>
    <c-item-card glyph="🌡" name="Warm spot" amount="~30 °C"></c-item-card>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6">
  <p class="eyebrow">Do this</p>
  <div class="mt-4 space-y-3">
    <c-step n="1" head="Warm the milk 🔥" cue="Bring just to a boil. Kill the heat." meta><c-chip tone="plain">8 min</c-chip></c-step>
    <c-step n="2" head="Cool to lukewarm 🌡" cue="Finger test: comfortable, not hot. Too hot kills the culture." meta><c-chip tone="plain">10 min</c-chip><c-chip tone="highlight">⚠ this is the trick</c-chip></c-step>
    <c-step n="3" head="Whisk in the starter 🥄" cue="1 tbsp of yesterday's curd. Stir smooth." meta><c-chip tone="plain">1 min</c-chip></c-step>
    <c-step n="4" head="Cover, warm, wait 🛌" cue="Oven with light on, warm cupboard, wrapped in a towel. Summer: 6 hr. Winter: 10 hr." meta><c-chip tone="plain">6–10 hr</c-chip></c-step>
    <c-step n="5" head="Fridge → set fully 🧊" cue="2 more hours in the fridge finishes the set. Now it slices clean." meta><c-chip tone="plain">2 hr</c-chip></c-step>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6">
  <p class="eyebrow">If something goes wrong</p>
  <div class="mt-4 grid gap-3">
    <c-tip-card glyph="💧" heading="Watery / not set" text="Milk was too hot when starter went in, or spot wasn't warm enough. Try again."></c-tip-card>
    <c-tip-card glyph="😖" heading="Too sour" text="Left it out too long. Refrigerate earlier next time."></c-tip-card>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6 pb-10">
  <p class="eyebrow">Now that you have curd</p>
  <div class="mt-4 grid gap-3 sm:grid-cols-3">
    <c-journey-card state="soon" glyph="🥤" tint="plain" name="Lassi" sub="Blend with water + salt or sugar."></c-journey-card>
    <c-journey-card state="soon" glyph="🥗" tint="vegetable" name="Raita" sub="Mix cucumber / boondi / mint."></c-journey-card>
    <c-journey-card state="soon" glyph="🍲" tint="highlight" name="Kadhi" sub="Cook down with besan + spice."></c-journey-card>
  </div>
</section>

<c-site-footer></c-site-footer>
    </div>
  </div>
</div>

</body>
</html>
