            <text x="660" y="398" class="node-label" fill="var(--ink)" font-weight="600" font-size="15">Herb kombucha</text>
            <text x="660" y="416" fill="var(--ink-2)" font-size="11">mint · basil · tulsi</text>
            <text class="node-arrow" x="795" y="415" fill="var(--brand-500)" font-size="12">→</text>
          </g>
        </a>

<section class="mx-auto max-w-6xl px-5 py-8">

    <c-journey-card glyph="🫙" tint="starter-34" name="Base kombucha" sub="Sweet tea + SCOBY + starter liquid → 7–14 days." skill="todo" href="kombucha-basic.html"></c-journey-card>
