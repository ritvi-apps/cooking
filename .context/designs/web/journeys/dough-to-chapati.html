<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — Dough → Chapati</title>
  <script src="../../shell.js"></script>
</head>
<body data-page="journeys/dough-to-chapati" data-status="review">

<div class="stage">
  <div class="phone">
    <div class="screen">
<c-site-nav active="none" size="regular"></c-site-nav>

<section class="mx-auto max-w-3xl px-5 pt-8 pb-4">
  <c-crumbs home="../home/home.html" up="dough.html" up-label="Dough" here="Chapati" class="mb-4"></c-crumbs>

  <c-transform-hero from="🌾" to="🫓" tint="grain" tone="cat-grain-fg" kicker="Dough → chapati" heading="Soft chapati that puffs." lede="Whole wheat, water, salt — that's it. The puff comes from technique, not ingredients."></c-transform-hero>
</section>

<section class="mx-auto max-w-3xl px-5 py-4">
  <div class="grid grid-cols-4 gap-2">
    <c-stat label="Makes" value="8 rotis" tone="plain"></c-stat>
    <c-stat label="Mix" value="10 min" tone="plain"></c-stat>
    <c-stat label="Cook" value="3 min each" tone="plain"></c-stat>
    <c-stat label="Skill" value="Learning ⌛" tone="highlight"></c-stat>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6">
  <p class="eyebrow">What you need</p>
  <div class="mt-4 grid gap-3 sm:grid-cols-3">
    <c-item-card glyph="🌾" name="Atta" amount="2 cups whole wheat"></c-item-card>
    <c-item-card glyph="💧" name="Warm water" amount="~¾ cup"></c-item-card>
    <c-item-card glyph="🧂" name="Salt · ghee" amount="½ tsp · 1 tsp"></c-item-card>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6">
  <p class="eyebrow">Do this</p>
  <div class="mt-4 space-y-3">
    <c-step n="1" head="Mix & shaggy" icon="soup" tone="ink-2" cue="Atta + salt + a tsp of ghee. Add water bit by bit until it just holds." meta><c-chip tone="plain" icon="clock">3 min</c-chip></c-step>
    <c-step n="2" head="Knead until smooth" icon="utensils" tone="ink-2" cue="Push and fold for 5 min. Soft, smooth, springs back when poked." meta><c-chip tone="accent" icon="target">softer than you think</c-chip></c-step>
    <c-step n="3" head="Rest, covered" icon="clock" tone="ink-2" cue="20 min. Gluten relaxes → thin rolls without tearing." meta><c-chip tone="plain" icon="clock">20 min</c-chip></c-step>
    <c-step n="4" head="Divide, dust, roll" icon="slice" tone="ink-2" cue="8 balls. Dust with dry atta. Roll thin — turn quarter-turn between passes for a round shape."></c-step>
    <c-step n="5" head="Hot dry tawa" icon="flame" tone="accent-700" cue="Medium-high. Slap the roti on. 20 seconds → flip → 30 seconds → tiny bubbles appear."></c-step>
    <c-step n="6" head="Flame puff (the magic)" icon="sparkles" tone="brand-500" cue="Tongs, straight over gas flame. It balloons in 5 seconds. Flip once. Done." meta><c-chip tone="accent" icon="target">the puff = the reward</c-chip></c-step>
    <c-step n="7" head="Ghee brush, stack" icon="droplet" tone="highlight-700" cue="Brush with ghee. Stack in a lined casserole → stays soft for hours."></c-step>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6">
  <p class="eyebrow">If something goes wrong</p>
  <div class="mt-4 grid gap-3">
    <c-tip-card variant="icon" icon="triangle-alert" heading="Didn't puff" text="Rolled uneven, or tawa too cold. Both fix themselves next time."></c-tip-card>
    <c-tip-card variant="icon" icon="triangle-alert" heading="Cracked at edges" text="Dough too dry → knead in a few drops of water and rest again."></c-tip-card>
    <c-tip-card variant="icon" icon="triangle-alert" heading="Turned hard/leathery" text="Cooked too long on the tawa. 30 seconds each side is enough before the flame."></c-tip-card>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6 pb-10">
  <p class="eyebrow">Try next</p>
  <div class="mt-4 grid gap-3 sm:grid-cols-2">
    <c-journey-card glyph="🥞" tint="grain" name="Paratha" sub="Same dough, layered with ghee." href="dough-to-paratha.html" data-link="side"></c-journey-card>
    <c-journey-card glyph="🌾" tint="grain" name="Back to the map" sub="All dough transformations." href="dough.html" data-link="back"></c-journey-card>
  </div>
</section>

<c-site-footer></c-site-footer>
    </div>
  </div>
</div>

</body>
</html>
