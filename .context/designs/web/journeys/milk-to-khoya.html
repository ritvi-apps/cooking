<!doctype html>
<html lang="en">

<body data-page="journeys/milk-to-khoya" data-status="review">

<div class="stage">

<c-site-nav active="none" size="regular"></c-site-nav>

<section class="mx-auto max-w-3xl px-5 pt-8 pb-4">
  <c-back-pill back="milk.html" label="Milk journey"></c-back-pill>
  <c-transform-hero arrow="text" from="🥛" to="🍮" tint="fruit" tone="accent-700" kicker="Milk → khoya (mawa)" heading="Reduce milk to a soft dough." lede="Slow simmer for 2 hours, stir constantly at the end. The base of most Indian sweets."></c-transform-hero>

<section class="mx-auto max-w-3xl px-5 py-4">

  <p class="eyebrow">The idea</p>
  <div class="mt-4 space-y-3">
    <c-step n="1" head="Wide, heavy pan 🍳" cue="More surface area = faster reduction. Kadhai works."></c-step>
    <c-step n="2" head="Simmer, stir often 🌀" cue="Medium-low. Scrape the sides — that browning is flavour."></c-step>
    <c-step n="3" head="Last 20 min: constant stir 🥄" cue="Now it can scorch. Do not walk away."></c-step>
    <c-step n="4" head="Dough consistency = done 🎯" cue="Pulls away from the pan into a soft, pale-brown ball."></c-step>
