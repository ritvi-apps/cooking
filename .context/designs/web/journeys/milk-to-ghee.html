<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — Butter → Ghee</title>
  <script src="../../_shell/boot.js"></script>
</head>
<body data-page="journeys/milk-to-ghee" data-status="review">

<div class="stage">
  <div class="phone">
    <div class="screen">
<c-site-nav active="none" size="regular"></c-site-nav>

<section class="mx-auto max-w-3xl px-5 pt-8 pb-4">
  <c-back-pill back="milk.html" label="Milk journey"></c-back-pill>
  <c-transform-hero tint="none" arrow="text" from="🧈" to="🫙" tone="highlight-700" kicker="Butter → ghee" heading="Golden, nutty, shelf-stable." lede="Simmer butter → water evaporates → milk solids brown → strain the gold." style="background:linear-gradient(135deg,var(--highlight-100),var(--highlight-400));"></c-transform-hero>
</section>

<section class="mx-auto max-w-3xl px-5 py-4">
  <div class="grid grid-cols-4 gap-2">
    <c-stat label="Time" value="25 min" tone="plain"></c-stat>
    <c-stat label="Yield" value="~80%" tone="plain"></c-stat>
    <c-stat label="Difficulty" value="Easy" tone="plain"></c-stat>
    <c-stat label="Skill" value="Todo •" tone="muted"></c-stat>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6">
  <p class="eyebrow">The idea</p>
  <div class="mt-4 space-y-3">
    <c-step n="1" head="Melt butter on low 🔥" cue="Heavy-bottomed pan. No stirring."></c-step>
    <c-step n="2" head="Foam rises → skim (optional) 🥄" cue="Some traditions skim, some don't. Either works."></c-step>
    <c-step n="3" head="Wait for the crackle to quiet 🔉" cue="Water is out. Milk solids drop to the bottom and start browning."></c-step>
    <c-step n="4" head="Golden = done ✨" cue="Amber liquid, nutty smell, brown flecks at the bottom. Kill the heat."></c-step>
    <c-step n="5" head="Strain through muslin 💧" cue="Into a clean, dry glass jar. Shelf-stable for months."></c-step>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6 pb-10">
  <c-soon-note>Full write-up coming after I make my first batch.</c-soon-note>
</section>

<c-site-footer></c-site-footer>
    </div>
  </div>
</div>

</body>
</html>
