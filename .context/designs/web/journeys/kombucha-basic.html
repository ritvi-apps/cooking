<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — Base kombucha</title>
  <script src="../../_shell/boot.js"></script>
</head>
<body data-page="journeys/kombucha-basic" data-status="review">

<div class="stage">
  <div class="phone">
    <div class="screen">
<c-site-nav active="none" size="regular"></c-site-nav>

<section class="mx-auto max-w-3xl px-5 pt-8 pb-4">
  <c-crumbs home="../home/home.html" up="kombucha.html" up-label="Kombucha" here="Base brew" class="mb-4"></c-crumbs>
  <c-transform-hero from="🍵" to="🫙" tint="fruit" tone="accent-700" kicker="First ferment" heading="Brew the base kombucha." lede="Sweet tea + SCOBY + starter liquid. Sit for 7–14 days. That's a whole brew."></c-transform-hero>
</section>

<section class="mx-auto max-w-3xl px-5 py-4">
  <div class="grid grid-cols-4 gap-2">
    <c-stat label="Batch" value="2 L" tone="plain"></c-stat>
    <c-stat label="Ferment" value="7–14 days" tone="plain"></c-stat>
    <c-stat label="Hands-on" value="20 min" tone="plain"></c-stat>
    <c-stat label="Skill" value="Todo •" tone="muted"></c-stat>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6">
  <p class="eyebrow">What you need</p>
  <div class="mt-4 grid gap-3 sm:grid-cols-3">
    <c-item-card glyph="🍵" name="Black tea" amount="6 bags · 2 L water"></c-item-card>
    <c-item-card glyph="🍯" name="White sugar" amount="200 g · standard"></c-item-card>
    <c-item-card glyph="🫙" name="SCOBY + starter" amount="from a friend or shop"></c-item-card>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6">
  <p class="eyebrow">Do this</p>
  <div class="mt-4 space-y-3">
    <c-step n="1" head="Brew strong sweet tea" icon="flame" tone="accent-700" cue="Boil 2 L water → steep 6 bags of black tea 10 min → stir in 200 g sugar → cool completely." meta><c-chip tone="accent" icon="triangle-alert">hot tea kills the SCOBY</c-chip></c-step>
    <c-step n="2" head="Pour into a clean jar" icon="amphora" tone="ink-2" cue="Wide-mouth glass. Never metal touching the SCOBY."></c-step>
    <c-step n="3" head="Add starter liquid + SCOBY" icon="droplet" tone="ink-2" cue="200 ml of previous batch (or store-bought raw kombucha) + the SCOBY. It's fine if it sinks."></c-step>
    <c-step n="4" head="Cover with cloth, sit" icon="wind" tone="ink-2" cue="Breathable cloth + rubber band. Warm spot (~22–26 °C). Dark corner. No fridge."></c-step>
    <c-step n="5" head="Taste from day 7" icon="target" tone="brand-500" cue="Should taste tangy but still slightly sweet. Longer = more vinegary. Stop when you like it." meta><c-chip tone="accent" icon="target">taste = the only ready signal</c-chip></c-step>
    <c-step n="6" head="Reserve, bottle" icon="amphora" tone="ink-2" cue="Save 200 ml + SCOBY for the next batch. The rest goes into bottles → second ferment."></c-step>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6 pb-10">
  <p class="eyebrow">Next: flavor it</p>
  <div class="mt-4 grid gap-3 sm:grid-cols-3">
    <c-journey-card glyph="🍓" tint="fruit" name="Fruit" href="kombucha-fruit.html" data-link="side"></c-journey-card>
    <c-journey-card glyph="🫚" tint="legume-34" name="Ginger" href="kombucha-ginger.html" data-link="side"></c-journey-card>
    <c-journey-card glyph="🌿" tint="herb" name="Herb" href="kombucha-herb.html" data-link="side"></c-journey-card>
  </div>
</section>

<c-site-footer></c-site-footer>
    </div>
  </div>
</div>

</body>
</html>
