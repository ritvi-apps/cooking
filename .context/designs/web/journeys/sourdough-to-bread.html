<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — Sourdough bread</title>
  <script src="../../_shell/boot.js"></script>
</head>
<body data-page="journeys/sourdough-to-bread" data-status="review">

<div class="stage">
  <div class="phone">
    <div class="screen">
<c-site-nav active="none" size="regular"></c-site-nav>

<section class="mx-auto max-w-3xl px-5 pt-8 pb-4">
  <c-crumbs home="../home/home.html" up="sourdough.html" up-label="Sourdough" here="Bread" class="mb-4"></c-crumbs>
  <c-transform-hero from="🫙" to="🍞" tint="grain" tone="cat-grain-fg" kicker="Starter → bread" heading="The 24-hour loaf." lede="Mix at night, fold morning, bake evening. Crisp crust, open crumb, tangy."></c-transform-hero>
</section>

<section class="mx-auto max-w-3xl px-5 py-4">
  <div class="grid grid-cols-4 gap-2">
    <c-stat label="Makes" value="1 boule" tone="plain"></c-stat>
    <c-stat label="Timeline" value="~24 hr" tone="plain"></c-stat>
    <c-stat label="Hands-on" value="40 min" tone="plain"></c-stat>
    <c-stat label="Skill" value="Todo •" tone="muted"></c-stat>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6">
  <p class="eyebrow">The rhythm</p>
  <div class="mt-4 space-y-3">
    <c-step n="1" head="Evening · mix + rest" icon="soup" tone="ink-2" cue="500 g bread flour + 350 g water + 100 g active starter + 10 g salt. Mix. Rest 30 min (autolyse)."></c-step>
    <c-step n="2" head="Evening · stretch & fold ×4" icon="utensils" tone="ink-2" cue="Every 30 min for 2 hours. Grab, stretch up, fold over. Turn bowl. Four times per set."></c-step>
    <c-step n="3" head="Overnight · bulk ferment" icon="clock" tone="ink-2" cue="Cool room (~20 °C) for 8–10 hr, OR warm room 4–6 hr. Doubles in size."></c-step>
    <c-step n="4" head="Morning · shape + cold retard" icon="slice" tone="ink-2" cue="Pre-shape → 20 min bench rest → final shape → banneton → fridge 4–24 hr." meta><c-chip tone="accent" icon="target">cold retard = flavor + easier scoring</c-chip></c-step>
    <c-step n="5" head="Evening · Dutch oven, hot" icon="flame" tone="accent-700" cue="Preheat DO to 240 °C for 45 min. Score dough. Bake covered 25 min → uncovered 15 min."></c-step>
    <c-step n="6" head="Cool completely" icon="wind" tone="ink-2" cue="2 hours on a rack. Cutting hot = gummy. This is the hardest step."></c-step>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6 pb-10">
  <c-soon-note>Full write-up after the first loaf that survives being cut.</c-soon-note>
</section>

<c-site-footer></c-site-footer>
    </div>
  </div>
</div>

</body>
</html>
