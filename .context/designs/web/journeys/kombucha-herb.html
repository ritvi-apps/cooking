<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — Herb kombucha</title>
  <script src="../../shell.js"></script>
</head>
<body data-page="journeys/kombucha-herb" data-status="review">

<div class="stage">
  <div class="phone">
    <div class="screen">
<c-site-nav active="none" size="regular"></c-site-nav>

<section class="mx-auto max-w-3xl px-5 pt-8 pb-4">
  <c-crumbs home="../home/home.html" up="kombucha.html" up-label="Kombucha" here="Herb" class="mb-4"></c-crumbs>
  <c-transform-hero from="🫙" to="🌿" tint="herb" tone="brand-700" kicker="Second ferment" heading="Herb-infused kombucha." lede="Subtle, grown-up, aromatic. Mint · basil · tulsi · lavender · rosemary."></c-transform-hero>
</section>

<section class="mx-auto max-w-3xl px-5 py-4">
  <div class="grid grid-cols-4 gap-2">
    <c-stat label="Ferment" value="1–2 days" tone="plain"></c-stat>
    <c-stat label="Add" value="5 leaves" tone="plain"></c-stat>
    <c-stat label="Fizz" value="Gentle" tone="plain"></c-stat>
    <c-stat label="Skill" value="Todo •" tone="muted"></c-stat>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6">
  <p class="eyebrow">Do this</p>
  <div class="mt-4 space-y-3">
    <c-step n="1" head="Bruise the leaves" icon="leaf" tone="brand-500" cue="Clap between hands to release oils. Don't tear — bitter."></c-step>
    <c-step n="2" head="Add to bottle with 1 tsp honey" icon="amphora" tone="ink-2" cue="Herbs alone won't fizz — the honey is the fizz food."></c-step>
    <c-step n="3" head="Top with base, cap, wait" icon="clock" tone="ink-2" cue="1–2 days at room temp. Burp daily."></c-step>
    <c-step n="4" head="Fridge, strain, serve" icon="wind" tone="ink-2" cue="Strain out spent leaves. Ice."></c-step>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6">
  <p class="eyebrow">Try these combos</p>
  <div class="mt-4 grid gap-3 sm:grid-cols-3">
    <c-idea-card size="sm" glyph="🍃🍋" heading="Mint + lemon zest" text="Summer classic."></c-idea-card>
    <c-idea-card size="sm" glyph="🌿" heading="Tulsi + ginger" text="Ayurvedic vibes."></c-idea-card>
    <c-idea-card size="sm" glyph="💜" heading="Lavender + honey" text="Floral, one bud per bottle."></c-idea-card>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6 pb-10">
  <c-soon-note>Full write-up after mint season.</c-soon-note>
</section>

<c-site-footer></c-site-footer>
    </div>
  </div>
</div>

</body>
</html>
