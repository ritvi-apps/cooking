<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — Dough → Pizza</title>
  <script src="../../_shell/boot.js"></script>
</head>
<body data-page="journeys/dough-to-pizza" data-status="review">

<div class="stage">
  <div class="phone">
    <div class="screen">
<c-site-nav active="none" size="regular"></c-site-nav>

<section class="mx-auto max-w-3xl px-5 pt-8 pb-4">
  <c-crumbs home="../home/home.html" up="dough.html" up-label="Dough" here="Pizza base" class="mb-4"></c-crumbs>
  <c-transform-hero from="🌾" to="🍕" tint="spice" tone="accent-700" kicker="Dough → pizza base" heading="Blistered crust, home oven." lede="Maida + water + yeast + salt + olive oil. One-hour rise. Oven at max, preheated pan."></c-transform-hero>
</section>

<section class="mx-auto max-w-3xl px-5 py-4">
  <div class="grid grid-cols-4 gap-2">
    <c-stat label="Makes" value="2 pies" tone="plain"></c-stat>
    <c-stat label="Rise" value="1 hr" tone="plain"></c-stat>
    <c-stat label="Bake" value="7 min" tone="plain"></c-stat>
    <c-stat label="Skill" value="Todo •" tone="muted"></c-stat>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6">
  <p class="eyebrow">The idea</p>
  <div class="mt-4 space-y-3">
    <c-step n="1" head="Wake the yeast" icon="sparkles" tone="highlight-700" cue="1 tsp active dry yeast + ½ cup warm water + 1 tsp sugar. Wait 10 min → foamy."></c-step>
    <c-step n="2" head="Mix, knead 8 min" icon="utensils" tone="ink-2" cue="2½ cups maida + 1 tsp salt + 2 tbsp olive oil + yeast water + ~½ cup more water. Windowpane test."></c-step>
    <c-step n="3" head="Rise 1 hour" icon="clock" tone="ink-2" cue="Oiled bowl, covered, warm spot. Doubled in size."></c-step>
    <c-step n="4" head="Preheat oven + pan" icon="flame" tone="accent-700" cue="Max temp (~250 °C). Cast iron or pizza stone in there for 20 min. Hot = blister." meta><c-chip tone="accent" icon="target">preheat the pan, not just the oven</c-chip></c-step>
    <c-step n="5" head="Stretch, top, bake" icon="cooking-pot" tone="ink-2" cue="Stretch by hand (don't roll). Sauce → cheese → toppings sparse. 7 min on the hot pan."></c-step>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6 pb-10">
  <c-soon-note>Full write-up after I get the char right.</c-soon-note>
</section>

<c-site-footer></c-site-footer>
    </div>
  </div>
</div>

</body>
</html>
