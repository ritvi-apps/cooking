<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — Dough → Naan</title>
  <script src="../../_shell/boot.js"></script>
</head>
<body data-page="journeys/dough-to-naan" data-status="review">

<div class="stage">
  <div class="phone">
    <div class="screen">
<c-site-nav active="none" size="regular"></c-site-nav>

<section class="mx-auto max-w-3xl px-5 pt-8 pb-4">
  <c-crumbs home="../home/home.html" up="dough.html" up-label="Dough" here="Naan" class="mb-4"></c-crumbs>
  <c-transform-hero from="🌾" to="🫓" tint="grain" tone="cat-grain-fg" kicker="Dough → naan" heading="Restaurant naan, no tandoor." lede="Yogurt-enriched dough → tawa flip trick to mimic a tandoor bake at home."></c-transform-hero>
</section>

<section class="mx-auto max-w-3xl px-5 py-4">
  <div class="grid grid-cols-4 gap-2">
    <c-stat label="Makes" value="6" tone="plain"></c-stat>
    <c-stat label="Rest" value="2 hr" tone="plain"></c-stat>
    <c-stat label="Cook" value="3 min each" tone="plain"></c-stat>
    <c-stat label="Skill" value="Todo •" tone="muted"></c-stat>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6">
  <p class="eyebrow">The idea</p>
  <div class="mt-4 space-y-3">
    <c-step n="1" head="Enriched dough" icon="soup" tone="ink-2" cue="Maida + yogurt + milk + a pinch of yeast (or baking powder + soda) + sugar + salt."></c-step>
    <c-step n="2" head="Rest 2 hours" icon="clock" tone="ink-2" cue="Warm spot, covered. Puffs slightly."></c-step>
    <c-step n="3" head="Roll oval, wet one side" icon="droplet" tone="highlight-700" cue="Water on one side helps it stick to the pan."></c-step>
    <c-step n="4" head="Wet side down, cover, flip" icon="flame" tone="accent-700" cue="Cook 1 min covered → flip the whole pan upside-down over the flame for 30 sec (careful!) → the top chars like a tandoor." meta><c-chip tone="accent" icon="target">the pan-flip trick is the whole recipe</c-chip></c-step>
    <c-step n="5" head="Butter + coriander" icon="leaf" tone="brand-500" cue="Brush hot naan with butter, sprinkle chopped coriander."></c-step>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6 pb-10">
  <c-soon-note>Full write-up after I try the flip.</c-soon-note>
</section>

<c-site-footer></c-site-footer>
    </div>
  </div>
</div>

</body>
</html>
