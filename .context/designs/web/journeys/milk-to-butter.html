<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — Milk → Butter</title>
  <script src="../../_shell/boot.js"></script>
</head>
<body data-page="journeys/milk-to-butter" data-status="review">

<div class="stage">
  <div class="phone">
    <div class="screen">
<c-site-nav active="none" size="regular"></c-site-nav>

<section class="mx-auto max-w-3xl px-5 pt-8 pb-4">
  <c-back-pill back="milk.html" label="Milk journey"></c-back-pill>
  <c-transform-hero tint="none" arrow="text" from="🥛" to="🧈" tone="highlight-700" kicker="Milk → butter (makhan)" heading="Churn cream until it splits." lede="Skim the top layer off milk/curd for a few days → whip in a stand mixer → butter and buttermilk part ways." style="background:linear-gradient(135deg,var(--highlight-100),var(--highlight-400));"></c-transform-hero>
</section>

<section class="mx-auto max-w-3xl px-5 py-4">
  <div class="grid grid-cols-4 gap-2">
    <c-stat label="Time" value="~20 min" tone="plain"></c-stat>
    <c-stat label="Yield" value="Varies" tone="plain"></c-stat>
    <c-stat label="Difficulty" value="Easy" tone="plain"></c-stat>
    <c-stat label="Skill" value="Todo •" tone="muted"></c-stat>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6">
  <p class="eyebrow">The idea</p>
  <div class="mt-4 space-y-3">
    <c-step n="1" head="Collect cream 🥛" cue="Skim the top layer off boiled milk into a jar; keep in fridge for 3–7 days."></c-step>
    <c-step n="2" head="Churn or whip 🌀" cue="Stand mixer whisk on high, or blend with a splash of cold water. 5–10 min."></c-step>
    <c-step n="3" head="Wait for the split 🧈" cue="You'll see it: butter clumps to one side, buttermilk pools out."></c-step>
    <c-step n="4" head="Rinse with cold water 🚿" cue="Rinses out residual buttermilk → butter that keeps longer."></c-step>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6 pb-10">
  <p class="eyebrow">Next steps</p>
  <div class="mt-4 grid gap-3 sm:grid-cols-2">
    <c-journey-card arrow="text" glyph="🫙" tint="butter" name="Butter → Ghee" sub="Simmer the butter, foam it, brown the solids." href="milk-to-ghee.html" data-link="side"></c-journey-card>
    <c-journey-card state="soon" glyph="🥛" tint="plain" name="Buttermilk (chaas)" sub="Season with cumin, ginger, salt, curry leaves."></c-journey-card>
  </div>

  <c-soon-note class="mt-8">This one is on my learning list — I'll flesh it out after I cook it.</c-soon-note>
</section>

<c-site-footer></c-site-footer>
    </div>
  </div>
</div>

</body>
</html>
