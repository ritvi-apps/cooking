<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — Milk → Paneer</title>
  <script src="../../_shell/boot.js"></script>
</head>
<body data-page="journeys/milk-to-paneer" data-status="review" data-journeys="Learn">

<div class="stage">
  <div class="phone">
    <div class="screen">
<c-site-nav active="none" size="regular"></c-site-nav>

<!-- ============ HERO ============ -->
<section class="mx-auto max-w-3xl px-5 pt-8 pb-4">
  <c-back-pill back="milk.html" label="Milk journey"></c-back-pill>

  <c-transform-hero arrow="text" from="🥛" to="🧀" tint="dairy" tone="cat-dairy" kicker="Milk → paneer" heading="Make paneer in 30 minutes." lede="Split milk with an acid, drain, press. That's the whole thing."></c-transform-hero>
</section>

<!-- ============ QUICK FACTS ============ -->
<section class="mx-auto max-w-3xl px-5 py-4">
  <div class="grid grid-cols-4 gap-2">
    <c-stat label="Time" value="30 min" tone="plain"></c-stat>
    <c-stat label="Yield" value="~200 g" tone="plain"></c-stat>
    <c-stat label="Difficulty" value="Easy" tone="plain"></c-stat>
    <c-stat label="Skill" value="Solid ✓" tone="brand"></c-stat>
  </div>
</section>

<!-- ============ WHAT YOU NEED ============ -->
<section class="mx-auto max-w-3xl px-5 py-6">
  <p class="eyebrow">What you need</p>
  <div class="mt-4 grid gap-3 sm:grid-cols-3">
    <c-item-card glyph="🥛" name="Whole milk" amount="1 litre · full fat"></c-item-card>
    <c-item-card glyph="🍋" name="Lemon" amount="2 tbsp juice"></c-item-card>
    <c-item-card glyph="🧻" name="Muslin cloth" amount="+ colander, weight"></c-item-card>
  </div>
</section>

<!-- ============ STEPS ============ -->
<section class="mx-auto max-w-3xl px-5 py-6">
  <p class="eyebrow">Do this</p>

  <div class="mt-4 space-y-3">
    <c-step n="1" head="Boil the milk 🔥" cue="Medium heat. Big lazy bubbles = ready." meta>
          <c-chip tone="plain">~10 min</c-chip>
          <c-chip tone="accent">🥄 stir often</c-chip>
        </c-step>

    <c-step n="2" head="Kill the heat, wait 30 seconds ⏸" cue="The &quot;shivering point.&quot; Hot but not raging." meta>
          <c-chip tone="plain">30 sec</c-chip>
        </c-step>

    <c-step n="3" head="Add lemon, one tbsp at a time 🍋" cue="Stir gently. Stop when the whey turns clear yellow-green." meta>
          <c-chip tone="plain">2 min</c-chip>
          <c-chip tone="highlight">⚠ don't dump it all in</c-chip>
        </c-step>

    <c-step n="4" head="Rest 5 minutes 🧘" cue="Curds firm up. Don't stir." meta>
          <c-chip tone="plain">5 min</c-chip>
        </c-step>

    <c-step n="5" head="Strain through muslin 💧" cue="Save the whey — knead into roti dough, water your plants." meta>
          <c-chip tone="plain">2 min</c-chip>
          <c-chip tone="brand">♻ save the whey</c-chip>
        </c-step>

    <c-step n="6" head="Rinse with cold water 🚿" cue="Washes off residual acid. Skip this → sour paneer." meta>
          <c-chip tone="plain">1 min</c-chip>
        </c-step>

    <c-step n="7" head="Twist, press, wait ⚖" cue="Cubes → 30 min under 2 kg. Grilling → 2 hours. Bhurji → skip pressing." meta>
          <c-chip tone="plain">30 min – 2 hr</c-chip>
          <c-chip tone="plain">choose your press</c-chip>
        </c-step>
  </div>
</section>

<!-- ============ VARIATIONS ============ -->
<section class="mx-auto max-w-3xl px-5 py-6">
  <p class="eyebrow">Choose your acid</p>
  <div class="mt-4 grid gap-3 sm:grid-cols-3">
    <c-idea-card size="md" glyph="🍋" heading="Lemon" text="Softest texture. Slight citrus note. My default."></c-idea-card>
    <c-idea-card size="md" glyph="🧪" heading="White vinegar" text="Firmer. Cleaner flavour. Best for grilling."></c-idea-card>
    <c-idea-card size="md" glyph="♻" heading="Old whey" text="Traditional. Softer curds. Zero waste."></c-idea-card>
  </div>
</section>

<!-- ============ TROUBLESHOOT ============ -->
<section class="mx-auto max-w-3xl px-5 py-6">
  <p class="eyebrow">If something goes wrong</p>
  <div class="mt-4 grid gap-3">
    <c-tip-card glyph="😰" heading="Milk didn't split" text="Add another tablespoon of acid. If it still won't budge → milk is ultra-pasteurized; try a fresher brand next time."></c-tip-card>
    <c-tip-card glyph="🥶" heading="Paneer is rubbery" text="You skipped the rinse or pressed too hard. Ease off next time."></c-tip-card>
    <c-tip-card glyph="😖" heading="Tastes sour" text="Too much acid. Rinse the curds better and stop the moment whey turns clear."></c-tip-card>
  </div>
</section>

<!-- ============ NEXT STEP ============ -->
<section class="mx-auto max-w-3xl px-5 py-6">
  <p class="eyebrow">Now that you have paneer</p>
  <div class="mt-4 grid gap-3 sm:grid-cols-2">
    <c-journey-card arrow="text" glyph="🥬" tint="vegetable" name="Palak paneer" sub="Bright spinach gravy, cubed paneer." href="../recipes/palak-paneer.html"></c-journey-card>
    <c-journey-card arrow="text" glyph="🧀" tint="dairy" name="About paneer" sub="Pros, cons, how to store it, what it pairs with." href="../ingredients/paneer.html" data-link="side"></c-journey-card>
  </div>
</section>

<!-- ============ VIDEOS I LEARNED FROM ============ -->
<section class="mx-auto max-w-3xl px-5 py-6 pb-10">
  <p class="eyebrow">Learned from</p>
  <div class="mt-4 grid gap-3 sm:grid-cols-2">
    <c-video-card tint="spice" heading="Perfect paneer, every time" byline="Hebbar's Kitchen · 6 min" href="#"></c-video-card>
    <c-video-card tint="dairy" heading="The paneer that broke me — and the fix" byline="Ranveer Brar · 12 min" href="#"></c-video-card>
  </div>
</section>

<c-site-footer></c-site-footer>
    </div>
  </div>
</div>

</body>
</html>
