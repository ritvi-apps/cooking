<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — Sourdough pizza</title>
  <script src="../../shell.js"></script>
</head>
<body data-page="journeys/sourdough-to-pizza" data-status="review">

<div class="stage">
  <div class="phone">
    <div class="screen">
<c-site-nav active="none" size="regular"></c-site-nav>

<section class="mx-auto max-w-3xl px-5 pt-8 pb-4">
  <c-crumbs home="../home/home.html" up="sourdough.html" up-label="Sourdough" here="Pizza" class="mb-4"></c-crumbs>
  <c-transform-hero from="🫙" to="🍕" tint="spice" tone="accent-700" kicker="Starter → pizza" heading="Tangy, chewy, blistered." lede="Cold-fermented sourdough crust. Mix on day 1, bake on day 2 or 3. Better than any yeasted dough."></c-transform-hero>
</section>

<section class="mx-auto max-w-3xl px-5 py-4">
  <div class="grid grid-cols-4 gap-2">
    <c-stat label="Makes" value="4 pies" tone="plain"></c-stat>
    <c-stat label="Cold rise" value="24–72 hr" tone="plain"></c-stat>
    <c-stat label="Bake" value="6 min" tone="plain"></c-stat>
    <c-stat label="Skill" value="Todo •" tone="muted"></c-stat>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6">
  <p class="eyebrow">The idea</p>
  <div class="mt-4 space-y-3">
    <c-step n="1" head="Mix cool" icon="soup" tone="ink-2" cue="500 g bread flour + 350 g cold water + 100 g starter + 12 g salt + 20 g olive oil."></c-step>
    <c-step n="2" head="Bulk 4 hr room temp" icon="clock" tone="ink-2" cue="4 sets of stretch & fold in the first 2 hr. Then rest."></c-step>
    <c-step n="3" head="Divide, ball, fridge" icon="slice" tone="ink-2" cue="4 balls. Cold retard 24–72 hr. Longer = tangier." meta><c-chip tone="accent" icon="target">3-day fridge = magic crust</c-chip></c-step>
    <c-step n="4" head="Bake hottest possible" icon="flame" tone="accent-700" cue="Preheated cast iron or steel, oven at max. Stretch cold dough, top fast, bake 5–7 min."></c-step>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6 pb-10">
  <c-soon-note>Full write-up after the first three-day dough.</c-soon-note>
</section>

<c-site-footer></c-site-footer>
    </div>
  </div>
</div>

</body>
</html>
