<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — Ginger kombucha</title>
  <script src="../../shell.js"></script>
</head>
<body data-page="journeys/kombucha-ginger" data-status="review">

<div class="stage">
  <div class="phone">
    <div class="screen">
<c-site-nav active="none" size="regular"></c-site-nav>

<section class="mx-auto max-w-3xl px-5 pt-8 pb-4">
  <c-crumbs home="../home/home.html" up="kombucha.html" up-label="Kombucha" here="Ginger" class="mb-4"></c-crumbs>
  <c-transform-hero tint="none" from="🫙" to="🫚" tone="cat-grain-fg" kicker="Second ferment" heading="Spicy ginger fizz." lede="The gut-shot classic — potent, gingery, aggressive fizz. Small bottles work best." style="background:linear-gradient(135deg,var(--wash-legume),var(--wash-legume-2));"></c-transform-hero>
</section>

<section class="mx-auto max-w-3xl px-5 py-4">
  <div class="grid grid-cols-4 gap-2">
    <c-stat label="Ferment" value="2 days" tone="plain"></c-stat>
    <c-stat label="Add" value="1 tbsp/bottle" tone="plain"></c-stat>
    <c-stat label="Fizz" value="Very" tone="plain"></c-stat>
    <c-stat label="Skill" value="Todo •" tone="muted"></c-stat>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6">
  <p class="eyebrow">Do this</p>
  <div class="mt-4 space-y-3">
    <c-step n="1" head="Grate fresh ginger" icon="slice" tone="ink-2" cue="1 tbsp finely grated per 500 ml bottle. Fresh only — dried won't ferment."></c-step>
    <c-step n="2" head="Optional: 1 tsp honey" icon="droplet" tone="highlight-700" cue="Extra sugar = extra fizz. Skip if base is already sweet enough."></c-step>
    <c-step n="3" head="Top, cap, burp daily" icon="amphora" tone="ink-2" cue="Ginger produces aggressive fizz. Burp every 12 hours." meta><c-chip tone="accent" icon="triangle-alert">burp twice a day, not once</c-chip></c-step>
    <c-step n="4" head="Fridge day 2, strain, serve" icon="wind" tone="ink-2" cue="Strain out the ginger fibers as you pour. Ice cold."></c-step>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6 pb-10">
  <c-soon-note>Full write-up after the first batch.</c-soon-note>
</section>

<c-site-footer></c-site-footer>
    </div>
  </div>
</div>

</body>
</html>
