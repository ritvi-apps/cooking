<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — Sourdough starter</title>
  <script src="../../shell.js"></script>
</head>
<body data-page="journeys/sourdough-starter" data-status="review">

<div class="stage">
  <div class="phone">
    <div class="screen">
<c-site-nav active="none" size="regular"></c-site-nav>

<section class="mx-auto max-w-3xl px-5 pt-8 pb-4">
  <c-crumbs home="../home/home.html" up="sourdough.html" up-label="Sourdough" here="Starter" class="mb-4"></c-crumbs>
  <c-transform-hero tint="none" from="🌾💧" to="🫙" tone="cat-grain-fg" kicker="Day 1 → 7" heading="Grow a sourdough starter." lede="Flour + water + wild yeast in the air. Feed daily. In 5–7 days, it'll be strong enough to raise bread." style="background:linear-gradient(135deg,var(--wash-dough),var(--wash-dough-2));"></c-transform-hero>
</section>

<section class="mx-auto max-w-3xl px-5 py-4">
  <div class="grid grid-cols-4 gap-2">
    <c-stat label="First week" value="5–7 days" tone="plain"></c-stat>
    <c-stat label="Daily work" value="2 min" tone="plain"></c-stat>
    <c-stat label="Difficulty" value="Easy" tone="plain"></c-stat>
    <c-stat label="Life" value="Forever" tone="plain"></c-stat>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6">
  <p class="eyebrow">What you need</p>
  <div class="mt-4 grid gap-3 sm:grid-cols-3">
    <c-item-card glyph="🌾" name="Whole wheat + AP flour" amount="50/50 blend"></c-item-card>
    <c-item-card glyph="💧" name="Filtered water" amount="room temp"></c-item-card>
    <c-item-card glyph="🫙" name="Glass jar" amount="loose lid, kitchen scale"></c-item-card>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6">
  <p class="eyebrow">Do this — one week</p>
  <div class="mt-4 space-y-3">
    <c-step n="1" head="Day 1 · mix and wait" icon="soup" tone="ink-2" cue="50 g flour + 50 g water in the jar. Stir. Cover loosely. Warm spot. Do nothing for 24 hours." meta><c-chip tone="plain" icon="clock">2 min</c-chip></c-step>
    <c-step n="2" head="Day 2–3 · discard + feed" icon="recycle" tone="brand-500" cue="Discard half. Add 50 g flour + 50 g water. Stir. Wait 24 hours. May look boring — that's fine." meta><c-chip tone="highlight" icon="triangle-alert">false rise likely — ignore it</c-chip></c-step>
    <c-step n="3" head="Day 4–6 · twice-daily feeds" icon="clock" tone="ink-2" cue="Morning and evening: discard half → feed 50 g / 50 g. It'll start bubbling and rising between feeds."></c-step>
    <c-step n="4" head="Day 5–7 · float test" icon="droplet" tone="highlight-700" cue="Drop a spoonful into water. Floats = ready to bake bread. Sinks = feed one more day." meta><c-chip tone="accent" icon="target">float = green light</c-chip></c-step>
    <c-step n="5" head="Maintain forever" icon="heart" tone="accent-500" cue="Baking often: feed daily on the counter. Baking weekly: fridge, feed once a week. Give it a name."></c-step>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6">
  <p class="eyebrow">Signs it's healthy</p>
  <div class="mt-4 grid gap-3 sm:grid-cols-3">
    <c-idea-card size="sm" glyph="📈" heading="Doubles in 4–6 hr" text="After a feed."></c-idea-card>
    <c-idea-card size="sm" glyph="🫧" heading="Full of bubbles" text="Big and small, visible through jar."></c-idea-card>
    <c-idea-card size="sm" glyph="👃" heading="Yeasty, slightly sour" text="Not acetone, not nail-polish smell."></c-idea-card>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6 pb-10">
  <p class="eyebrow">Once it's alive</p>
  <div class="mt-4 grid gap-3 sm:grid-cols-2">
    <c-journey-card glyph="🍞" tint="grain" name="Bake bread" sub="The dream loaf, 24-hour timeline." href="sourdough-to-bread.html" data-link="side"></c-journey-card>
    <c-journey-card glyph="🥞" tint="plain" name="Use the discard" sub="Never throw it out." href="sourdough-to-pancakes.html" data-link="side"></c-journey-card>
  </div>
</section>

<c-site-footer></c-site-footer>
    </div>
  </div>
</div>

</body>
</html>
