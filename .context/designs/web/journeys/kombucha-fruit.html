<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — Fruit kombucha</title>
  <script src="../../shell.js"></script>
</head>
<body data-page="journeys/kombucha-fruit" data-status="review">

<div class="stage">
  <div class="phone">
    <div class="screen">
<c-site-nav active="none" size="regular"></c-site-nav>

<section class="mx-auto max-w-3xl px-5 pt-8 pb-4">
  <c-crumbs home="../home/home.html" up="kombucha.html" up-label="Kombucha" here="Fruit" class="mb-4"></c-crumbs>
  <c-transform-hero from="🫙" to="🍓" tint="fruit" tone="accent-700" kicker="Second ferment" heading="Fruit kombucha, fizzy." lede="Base kombucha + a bit of fruit → sealed → 1–3 days at room temp = fizz."></c-transform-hero>
</section>

<section class="mx-auto max-w-3xl px-5 py-4">
  <div class="grid grid-cols-4 gap-2">
    <c-stat label="Ferment" value="1–3 days" tone="plain"></c-stat>
    <c-stat label="Add" value="10% fruit" tone="plain"></c-stat>
    <c-stat label="Difficulty" value="Easy" tone="plain"></c-stat>
    <c-stat label="Skill" value="Todo •" tone="muted"></c-stat>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6">
  <p class="eyebrow">Do this</p>
  <div class="mt-4 space-y-3">
    <c-step n="1" head="Fruit in the bottle first" icon="amphora" tone="ink-2" cue="2 tbsp fresh fruit purée or juice per 500 ml bottle. Strawberry, mango, apple, pomegranate work well."></c-step>
    <c-step n="2" head="Top with base 'buch" icon="droplet" tone="ink-2" cue="Leave 2 cm headroom. Cap tight."></c-step>
    <c-step n="3" head="Wait 1–3 days at room temp" icon="clock" tone="ink-2" cue="Burp bottles daily (release CO₂) for the first two days." meta><c-chip tone="accent" icon="triangle-alert">skip burping = bottle bomb</c-chip></c-step>
    <c-step n="4" head="Fridge → serve cold" icon="wind" tone="ink-2" cue="Chilling stops the fermentation. Now you have fizzy fruit 'buch."></c-step>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6 pb-10">
  <c-soon-note>Full write-up after the first non-exploding bottle.</c-soon-note>
</section>

<c-site-footer></c-site-footer>
    </div>
  </div>
</div>

</body>
</html>
