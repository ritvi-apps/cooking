<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — Discard pancakes</title>
  <script src="../../shell.js"></script>
</head>
<body data-page="journeys/sourdough-to-pancakes" data-status="review">

<div class="stage">
  <div class="phone">
    <div class="screen">
<c-site-nav active="none" size="regular"></c-site-nav>

<section class="mx-auto max-w-3xl px-5 pt-8 pb-4">
  <c-crumbs home="../home/home.html" up="sourdough.html" up-label="Sourdough" here="Discard pancakes" class="mb-4"></c-crumbs>
  <c-transform-hero from="🫙" to="🥞" tint="plain" tone="cat-grain-fg" kicker="Discard → breakfast" heading="Never throw discard out again." lede="Tangy, tender pancakes in 15 minutes. Uses the 100 g of starter you'd normally toss."></c-transform-hero>
</section>

<section class="mx-auto max-w-3xl px-5 py-4">
  <div class="grid grid-cols-4 gap-2">
    <c-stat label="Makes" value="6" tone="plain"></c-stat>
    <c-stat label="Time" value="15 min" tone="plain"></c-stat>
    <c-stat label="Difficulty" value="Easy" tone="plain"></c-stat>
    <c-stat label="Skill" value="Todo •" tone="muted"></c-stat>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6">
  <p class="eyebrow">Do this</p>
  <div class="mt-4 space-y-3">
    <c-step n="1" head="Whisk it all together" icon="utensils" tone="ink-2" cue="200 g discard + 200 g milk + 1 egg + 2 tbsp sugar + ½ tsp salt + ½ tsp baking soda + 30 g melted butter."></c-step>
    <c-step n="2" head="Rest 5 min" icon="clock" tone="ink-2" cue="Soda + acid start fizzing. The bubbles are the puff."></c-step>
    <c-step n="3" head="Butter, ladle, flip" icon="flame" tone="accent-700" cue="Medium heat. Flip when bubbles pop across the surface and edges look dry."></c-step>
    <c-step n="4" head="Butter, maple, done" icon="droplet" tone="highlight-700" cue="Also great with jaggery + ghee, or a spoonful of dahi."></c-step>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6 pb-10">
  <c-soon-note>Full write-up after Saturday morning.</c-soon-note>
</section>

<c-site-footer></c-site-footer>
    </div>
  </div>
</div>

</body>
</html>
