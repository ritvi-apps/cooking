<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — Dough → Paratha</title>
  <script src="../../shell.js"></script>
</head>
<body data-page="journeys/dough-to-paratha" data-status="review">

<div class="stage">
  <div class="phone">
    <div class="screen">
<c-site-nav active="none" size="regular"></c-site-nav>

<section class="mx-auto max-w-3xl px-5 pt-8 pb-4">
  <c-crumbs home="../home/home.html" up="dough.html" up-label="Dough" here="Paratha" class="mb-4"></c-crumbs>
  <c-transform-hero from="🌾" to="🥞" tint="grain" tone="cat-grain-fg" kicker="Dough → paratha" heading="Layered, flaky, weekend bread." lede="Same dough as chapati. Fold ghee into the layers, roll flat, shallow-fry."></c-transform-hero>
</section>

<section class="mx-auto max-w-3xl px-5 py-4">
  <div class="grid grid-cols-4 gap-2">
    <c-stat label="Makes" value="6" tone="plain"></c-stat>
    <c-stat label="Cook" value="5 min each" tone="plain"></c-stat>
    <c-stat label="Difficulty" value="Medium" tone="plain"></c-stat>
    <c-stat label="Skill" value="Todo •" tone="muted"></c-stat>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6">
  <p class="eyebrow">Do this</p>
  <div class="mt-4 space-y-3">
    <c-step n="1" head="Roll a chapati" icon="slice" tone="ink-2" cue="Same dough, same first roll."></c-step>
    <c-step n="2" head="Brush with ghee, fold triangle" icon="droplet" tone="highlight-700" cue="Half → quarter fold with ghee at each fold. Ghee = the flakes."></c-step>
    <c-step n="3" head="Roll triangle out flat" icon="slice" tone="ink-2" cue="Keep it triangular. Dust with atta if it sticks."></c-step>
    <c-step n="4" head="Tawa + ghee on top" icon="flame" tone="accent-700" cue="Medium heat. Flip when bubbly. Drizzle ghee → press with a cloth for even golden."></c-step>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6 pb-10">
  <p class="eyebrow">Variations to try</p>
  <div class="mt-4 grid gap-3 sm:grid-cols-3">
    <c-idea-card size="lg" glyph="🥔" heading="Aloo paratha" text="Stuffed with spiced potato."></c-idea-card>
    <c-idea-card size="lg" glyph="🧀" heading="Paneer paratha" text="Grated paneer + green chilli."></c-idea-card>
    <c-idea-card size="lg" glyph="🥬" heading="Methi paratha" text="Kneaded with fenugreek leaves."></c-idea-card>
  </div>
  <c-soon-note class="mt-6">Full write-up coming after the first successful batch.</c-soon-note>
</section>

<c-site-footer></c-site-footer>
    </div>
  </div>
</div>

</body>
</html>
