<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — Dough → Poori</title>
  <script src="../../_shell/boot.js"></script>
</head>
<body data-page="journeys/dough-to-poori" data-status="review">

<div class="stage">
  <div class="phone">
    <div class="screen">
<c-site-nav active="none" size="regular"></c-site-nav>

<section class="mx-auto max-w-3xl px-5 pt-8 pb-4">
  <c-crumbs home="../home/home.html" up="dough.html" up-label="Dough" here="Poori" class="mb-4"></c-crumbs>
  <c-transform-hero from="🌾" to="🫓" tint="grain" tone="cat-grain-fg" kicker="Dough → poori" heading="Puffed like a golden balloon." lede="A firmer dough than chapati. Rolled small. Dropped into hot oil. Puffs, flip once, done."></c-transform-hero>
</section>

<section class="mx-auto max-w-3xl px-5 py-4">
  <div class="grid grid-cols-4 gap-2">
    <c-stat label="Makes" value="10–12" tone="plain"></c-stat>
    <c-stat label="Fry" value="40 sec each" tone="plain"></c-stat>
    <c-stat label="Difficulty" value="Easy" tone="plain"></c-stat>
    <c-stat label="Skill" value="Todo •" tone="muted"></c-stat>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6">
  <p class="eyebrow">Do this</p>
  <div class="mt-4 space-y-3">
    <c-step n="1" head="Firmer dough" icon="soup" tone="ink-2" cue="Same atta, less water than chapati. Should feel tight, not sticky."></c-step>
    <c-step n="2" head="Rest 10 min, roll small" icon="clock" tone="ink-2" cue="Palm-sized rounds, thicker than chapati. Use oil, not flour, to prevent sticking."></c-step>
    <c-step n="3" head="Oil at 180 °C" icon="thermometer" tone="accent-700" cue="Test: a pinch of dough should rise immediately with tiny bubbles." meta><c-chip tone="accent" icon="target">hot oil = puff, cold oil = greasy disk</c-chip></c-step>
    <c-step n="4" head="Drop, push, watch it puff" icon="sparkles" tone="brand-500" cue="Gently press with a spatula — that's what makes it balloon."></c-step>
    <c-step n="5" head="Flip once, drain" icon="droplet" tone="ink-2" cue="30 seconds each side. Golden, not brown."></c-step>
  </div>
</section>

<section class="mx-auto max-w-3xl px-5 py-6 pb-10">
  <c-soon-note>Full write-up after I nail the puff.</c-soon-note>
</section>

<c-site-footer></c-site-footer>
    </div>
  </div>
</div>

</body>
