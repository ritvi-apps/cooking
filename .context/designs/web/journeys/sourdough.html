<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — Sourdough journey</title>
  <script src="../../_shell/boot.js"></script>
</head>
<body data-page="journeys/sourdough" data-status="review">

<div class="stage">
  <div class="phone">
    <div class="screen">
<c-site-nav active="none" size="regular"></c-site-nav>

<section class="mx-auto max-w-6xl px-5 pt-8 pb-4">
  <c-crumbs home="../home/home.html" up="journeys.html" up-label="Journeys" here="Sourdough" class="mb-4"></c-crumbs>

  <c-journey-hero tint="none" glyph="🫙" tone="cat-grain-fg" kicker="Sourdough · journey" heading="One starter, many breads." lede="Water + flour + wild yeast = bubbling life. Feed it forever. It bakes bread, pancakes, pizza, and more." style="background:linear-gradient(135deg,var(--wash-dough),var(--wash-dough-2));">
      <c-chip tone="white" icon="amphora">Ferment</c-chip>
      <c-chip tone="white" icon="clock">7 days first time</c-chip>
      <c-chip tone="white" icon="hourglass">patience</c-chip>
    </c-journey-hero>
</section>

<!-- ============ THE GRAPH ============ -->
<section class="mx-auto max-w-6xl px-5 py-4">
  <div class="card p-4 md:p-6">
    <c-map-head label="The map"></c-map-head>
    <c-map-hint class="mb-3">Every node is a link</c-map-hint>

    <div style="overflow-x:auto;">
      <svg viewBox="0 0 980 480" style="display:block;width:100%;min-width:720px;height:auto;">
        <defs>
          <marker id="ar-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0 0L10 5L0 10Z" fill="var(--ink-3)"/>
          </marker>
          <linearGradient id="starterG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--wash-dough-5)"/>
            <stop offset="100%" stop-color="var(--wash-dough-2)"/>
          </linearGradient>
        </defs>

        <!-- Root → Starter -->
        <path d="M195 240 C 245 240, 245 240, 305 240" class="edge" marker-end="url(#ar-s)"/>
        <text x="215" y="230" class="edge-label">5–7 days feed</text>

        <!-- Starter → outputs -->
        <path d="M475 240 C 555 240, 555 90,  610 90"   class="edge-strong" marker-end="url(#ar-s)"/>
        <text x="510" y="170" class="edge-label" style="fill:var(--brand-700);font-weight:600;">bulk ferment + shape</text>
        <path d="M475 240 C 555 240, 555 240, 610 240"  class="edge" marker-end="url(#ar-s)"/>
        <text x="510" y="235" class="edge-label">discard batter</text>
        <path d="M475 240 C 555 240, 555 390, 610 390"  class="edge" marker-end="url(#ar-s)"/>
        <text x="510" y="330" class="edge-label">+ toppings · bake hot</text>

        <!-- ═══ ROOT: FLOUR + WATER ═══ -->
        <a href="#" onclick="return false;">
          <g>
            <circle class="node-hit" cx="120" cy="240" r="72" fill="var(--wash-dough-5)"/>
            <circle class="node-ring" cx="120" cy="240" r="72" fill="none" stroke="var(--cat-grain)" stroke-width="2.5"/>
            <text x="120" y="225" text-anchor="middle" font-size="30">🌾💧</text>
            <text x="120" y="260" text-anchor="middle" class="node-label" fill="var(--ink)" font-weight="600" font-size="14">Flour + water</text>
            <text x="120" y="278" text-anchor="middle" fill="var(--ink-2)" font-size="10.5">catch wild yeast</text>
          </g>
        </a>

        <!-- Tier 1: Starter -->
        <a href="sourdough-starter.html">
          <g>
            <rect class="node-hit" x="305" y="205" width="170" height="70" rx="16" fill="url(#starterG)"/>
            <rect class="node-ring" x="305" y="205" width="170" height="70" rx="16" fill="none" stroke="var(--cat-grain)" stroke-width="2.5"/>
            <text x="320" y="235" font-size="26">🫙</text>
            <text x="355" y="237" class="node-label" fill="var(--ink)" font-weight="600" font-size="16">Starter</text>
            <text x="355" y="257" fill="var(--ink-2)" font-size="11">alive, bubbly, forever</text>
            <text class="node-arrow" x="453" y="270" fill="var(--brand-500)" font-size="12">→</text>
          </g>
        </a>

        <!-- Tier 2 -->
        <a href="sourdough-to-bread.html">
          <g>
            <rect class="node-hit" x="610" y="55" width="200" height="70" rx="16" fill="var(--surface)"/>
            <rect class="node-ring" x="610" y="55" width="200" height="70" rx="16" fill="none" stroke="var(--cat-grain)" stroke-width="2"/>
            <text x="625" y="85" font-size="24">🍞</text>
            <text x="660" y="88" class="node-label" fill="var(--ink)" font-weight="600" font-size="15">Sourdough bread</text>
            <text x="660" y="106" fill="var(--ink-2)" font-size="11">boule · batard · 24 hr</text>
            <text class="node-arrow" x="795" y="105" fill="var(--brand-500)" font-size="12">→</text>
          </g>
        </a>
        <a href="sourdough-to-pancakes.html">
          <g>
            <rect class="node-hit" x="610" y="205" width="200" height="70" rx="16" fill="var(--surface)"/>
            <rect class="node-ring" x="610" y="205" width="200" height="70" rx="16" fill="none" stroke="var(--cat-grain)" stroke-width="2"/>
            <text x="625" y="235" font-size="24">🥞</text>
            <text x="660" y="238" class="node-label" fill="var(--ink)" font-weight="600" font-size="15">Discard pancakes</text>
            <text x="660" y="256" fill="var(--ink-2)" font-size="11">use the extra starter</text>
            <text class="node-arrow" x="795" y="255" fill="var(--brand-500)" font-size="12">→</text>
          </g>
        </a>
        <a href="sourdough-to-pizza.html">
          <g>
            <rect class="node-hit" x="610" y="355" width="200" height="70" rx="16" fill="var(--surface)"/>
            <rect class="node-ring" x="610" y="355" width="200" height="70" rx="16" fill="none" stroke="var(--cat-grain)" stroke-width="2"/>
            <text x="625" y="385" font-size="24">🍕</text>
            <text x="660" y="388" class="node-label" fill="var(--ink)" font-weight="600" font-size="15">Sourdough pizza</text>
            <text x="660" y="406" fill="var(--ink-2)" font-size="11">tangier crust</text>
            <text class="node-arrow" x="795" y="405" fill="var(--brand-500)" font-size="12">→</text>
          </g>
        </a>
      </svg>
    </div>
  </div>
</section>

<!-- ============ OUTPUTS ============ -->
<section class="mx-auto max-w-6xl px-5 py-8">
  <p class="eyebrow">Three things from one starter</p>
  <h2 class="h2 mt-2">Pick a path</h2>

  <div class="mt-6 grid gap-4 md:grid-cols-2">
    <c-journey-card glyph="🫙" tint="dough-34" name="Make the starter (day 1–7)" sub="Flour + water + wild yeast + one week of feeding." skill="todo" href="sourdough-starter.html"></c-journey-card>
    <c-journey-card glyph="🍞" tint="grain" name="Sourdough bread" sub="The dream loaf. 24-hour timeline. One fold, one bake." skill="todo" href="sourdough-to-bread.html"></c-journey-card>
    <c-journey-card glyph="🥞" tint="plain" name="Discard pancakes" sub="Never waste starter discard again. 15 min → breakfast." skill="todo" href="sourdough-to-pancakes.html"></c-journey-card>
    <c-journey-card glyph="🍕" tint="spice" name="Sourdough pizza" sub="Cold-ferment the dough overnight for a chewy, tangy crust." skill="todo" href="sourdough-to-pizza.html"></c-journey-card>
  </div>
</section>

<!-- ============ THE ONE IDEA ============ -->
<section class="mx-auto max-w-6xl px-5 py-6">
  <c-one-idea icon="sparkles" label="The one idea">A sourdough starter is a pet made of flour. Feed it, use half, feed again. The bread is a side effect.</c-one-idea>
</section>

<c-site-footer></c-site-footer>
    </div>
  </div>
</div>

</body>
</html>
