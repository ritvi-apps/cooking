<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — IngHero</title>
  <script src="../../shell.js" data-view="components"></script>
<template><div class="ing-hero {tint=dairy? grad-dairy}{tint=legume? grad-legume}{tint=plain? grad-plain}{tint=spice? grad-spice}{tint=vegetable? grad-vegetable}"><div class="big-glyph">{glyph}</div><div><p class="eyebrow" style="color:var(--{tone});">{kicker}</p><h1 class="h1 mt-1">{heading}</h1><p class="mt-2" style="font-size:14px;color:var(--ink-2);">{aka}</p></div></div></template>
</head>
<body data-component="ing-hero" data-group="Heroes">

<div class="cells">
  <c-ing-hero glyph="🧄" tint="plain" tone="cat-herb" kicker="Aromatic · allium" heading="Garlic" aka="Also: lehsun" class="w-[1100px]"></c-ing-hero>
  <c-ing-hero glyph="🌰" tint="spice" tone="cat-spice" kicker="Spice · seed" heading="Cumin" aka="Also: jeera" class="w-[1100px]"></c-ing-hero>
  <c-ing-hero glyph="🫚" tint="legume" tone="cat-legume" kicker="Aromatic · rhizome" heading="Ginger" aka="Also: adrak" class="w-[1100px]"></c-ing-hero>
  <c-ing-hero glyph="🧀" tint="dairy" tone="cat-dairy" kicker="Dairy · fresh cheese" heading="Paneer" aka="Also: chhena · Indian cottage cheese" class="w-[1100px]"></c-ing-hero>
  <c-ing-hero glyph="🥬" tint="vegetable" tone="cat-vegetable" kicker="Vegetable · leafy green" heading="Spinach" aka="Also: palak" class="w-[1100px]"></c-ing-hero>
</div>

</body>
</html>
