<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — PairGroup</title>
  <script src="../../shell.js" data-view="components"></script>
<template><div class="card p-4"><p class="text-base" style="color:var(--ink-3);font-weight:600;">{label}</p><div class="mt-2 flex flex-wrap gap-2"><slot></slot></div></div></template>
</head>
<body data-component="pair-group" data-group="Cards">

<div class="cells">
  <c-pair-group label="Vegetables" class="w-[360px]">
        <c-chip tone="plain">🥔 potato</c-chip>
        <c-chip tone="plain">🥦 cauliflower</c-chip>
        <c-chip tone="brand" as="link" href="#">🥬 spinach</c-chip>
      </c-pair-group>
</div>

</body>
</html>
