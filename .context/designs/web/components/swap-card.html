<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — SwapCard</title>
  <script src="../../shell.js" data-view="components"></script>
<template><div class="card p-4"><div class="flex items-center gap-2 mb-2"><span style="font-size:26px;">{glyph}</span><slot></slot></div><p class="font-display" style="font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-0.01em;">{heading}</p><p style="font-size:12px;color:var(--ink-2);">{text}</p></div></template>
</head>
<body data-component="swap-card" data-group="Cards">

<div class="cells">
  <c-swap-card glyph="🌱" heading="Firm tofu" text="Press well. Vegan-friendly straight swap." class="w-[360px]"><c-chip tone="brand">1:1</c-chip></c-swap-card>
</div>

</body>
</html>
