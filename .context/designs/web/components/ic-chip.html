<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — IcChip</title>
  <script src="../../shell.js" data-view="components"></script>
<template><div class="ic-chip">{glyph}<span class="lbl">{label}</span></div></template>
<template variant="avoid"><div class="ic-chip avoid">{glyph}<span class="lbl">{label}</span></div></template>
</head>
<body data-component="ic-chip" data-group="Chips">

<div class="cells">
  <c-ic-chip glyph="🌿" label="Basil" variant="plain"></c-ic-chip>
  <c-ic-chip variant="avoid" glyph="🥒" label="Cucumber (raw)"></c-ic-chip>
</div>

</body>
