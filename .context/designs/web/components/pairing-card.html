<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — PairingCard</title>
  <script src="../../shell.js" data-view="components"></script>
<template><div class="card p-5"><div class="flex items-center gap-3"><div class="pair-tile {a-tint}">{a}</div><div style="font-size:20px;">+</div><div class="pair-tile {b-tint}">{b}</div></div><h3 class="font-display mt-3" style="font-size:18px;font-weight:500;color:var(--ink);letter-spacing:-0.01em;">{heading}</h3><p class="mt-1.5" style="font-size:13px;color:var(--ink-2);line-height:1.55;"><slot></slot></p></div></template>
</head>
<body data-component="pairing-card" data-group="Cards">

<div class="cells">
  <c-pairing-card a="🌶️" a-tint="bg-highlight-100" b="🧈" b-tint="bg-highlight-100" heading="Turmeric + fat" class="w-[360px]">Curcumin is fat-soluble. Ghee, coconut oil, or full-fat milk raises absorption 7–10×. Never add turmeric to a fat-free dish.</c-pairing-card>
</div>

</body>
</html>
