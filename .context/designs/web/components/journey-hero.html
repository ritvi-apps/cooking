<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — JourneyHero</title>
  <script src="../../_shell/boot.js" data-view="components"></script>
</head>
<body data-component="journey-hero" data-group="Heroes">

<div class="cells">
  <c-journey-hero glyph="🌾" tint="grain" tone="cat-grain-fg" kicker="Dough · journey" heading="Flour + water = a dozen breads." lede="One base dough. Different fats, different rests, different heat — five different meals." class="w-[1100px]">
      <c-chip tone="white" icon="wheat">Grain</c-chip>
      <c-chip tone="white" icon="clock">10 min mix + rest</c-chip>
      <c-chip tone="white" icon="waypoints">5 outputs</c-chip>
    </c-journey-hero>
  <c-journey-hero glyph="🍵" tint="fruit" tone="accent-700" kicker="Kombucha · journey" heading="Fizzy fermented tea." lede="Sweet tea + a jelly-like SCOBY = tangy fizzy drink in 7–14 days. Endless flavor variations in the second ferment." class="w-[1100px]">
      <c-chip tone="white" icon="amphora">Ferment</c-chip>
      <c-chip tone="white" icon="clock">7–14 days</c-chip>
      <c-chip tone="white" icon="hourglass">patience</c-chip>
    </c-journey-hero>
  <c-journey-hero glyph="🥛" tint="dairy" tone="cat-dairy" kicker="Milk · journey" heading="Everything milk can become." lede="One ingredient, five paths. Every node below is tappable." class="w-[1100px]">
      <c-chip tone="white" icon="droplet">Dairy</c-chip>
      <c-chip tone="white" icon="clock">30 min – 2 hr</c-chip>
      <c-chip tone="white" icon="waypoints">4 transformations</c-chip>
    </c-journey-hero>
  <c-journey-hero tint="none" glyph="🫙" tone="cat-grain-fg" kicker="Sourdough · journey" heading="One starter, many breads." lede="Water + flour + wild yeast = bubbling life. Feed it forever. It bakes bread, pancakes, pizza, and more." style="background:linear-gradient(135deg,var(--wash-dough),var(--wash-dough-2));" class="w-[1100px]">
      <c-chip tone="white" icon="amphora">Ferment</c-chip>
      <c-chip tone="white" icon="clock">7 days first time</c-chip>
      <c-chip tone="white" icon="hourglass">patience</c-chip>
    </c-journey-hero>
</div>

</body>
</html>
