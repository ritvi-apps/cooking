<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — BentoHero</title>
  <script src="../../shell.js" data-view="components"></script>
<template><div class="bento-hero"><div class="glyph {tint=brand? grad-brand}{tint=spice? grad-spice}">{glyph}</div><div class="flex-1 min-w-0"><div class="title">{heading}</div><div class="sub"><slot></slot></div></div><slot name="end"></slot></div></template>
</head>
<body data-component="bento-hero" data-group="Heroes">

<div class="cells">
  <c-bento-hero glyph="🌱" tint="brand" heading="Grow · Tomato" class="w-[1100px]">
      <c-chip tone="brand" style="padding:2px 8px;font-size:10.5px;">India · 3 seasons</c-chip>
      <c-chip tone="plain" style="padding:2px 8px;font-size:10.5px;">60 – 100 days</c-chip>
      <c-chip tone="plain" style="padding:2px 8px;font-size:10.5px;">40 – 60 t / ha</c-chip>
    <a slot="end" href="#" class="btn btn-white btn-sm">← Tomato</a></c-bento-hero>
  <c-bento-hero glyph="🍅" tint="spice" heading="Tomato" class="w-[1100px]">
      <c-chip tone="brand" style="padding:2px 8px;font-size:10.5px;">Kharif · Rabi · Zaid</c-chip>
      <c-chip tone="plain" style="padding:2px 8px;font-size:10.5px;">60 – 100 days</c-chip>
      <c-chip tone="plain" style="padding:2px 8px;font-size:10.5px;">21 – 27 °C</c-chip>
    <a slot="end" href="#" class="btn btn-white btn-sm">Pairings</a><a slot="end" href="#" class="btn btn-white btn-sm">All ingredients</a></c-bento-hero>
</div>

</body>
</html>
