<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — TransformHero</title>
  <script src="../../shell.js" data-view="components"></script>
<template><div class="card {tint=dairy? grad-dairy}{tint=fruit? grad-fruit}{tint=grain? grad-grain}{tint=herb? grad-herb}{tint=plain? grad-plain}{tint=spice? grad-spice} p-6 md:p-8"><div class="flex items-center gap-4"><span style="font-size:44px;">{from}</span><span style="color:var(--ink-3);"><i data-lucide="arrow-right" class="hb-icon w-[24px] h-[24px]" stroke-width="1.75"></i></span><span style="font-size:44px;">{to}</span></div><p data-if="!tone" class="eyebrow mt-4">{kicker}</p><p data-if="tone" class="eyebrow mt-4" style="color:var(--{tone});">{kicker}</p><h1 class="h1 mt-2">{heading}</h1><p class="mt-3" style="font-size:15.5px;line-height:1.55;color:var(--ink-2);max-width:520px;">{lede}</p></div></template>
<template arrow="text"><div class="card {tint=dairy? grad-dairy}{tint=fruit? grad-fruit}{tint=grain? grad-grain}{tint=herb? grad-herb}{tint=plain? grad-plain}{tint=spice? grad-spice} p-6 md:p-8"><div class="flex items-center gap-4"><span style="font-size:44px;">{from}</span><span style="font-size:26px;color:var(--ink-3);">→</span><span style="font-size:44px;">{to}</span></div><p data-if="!tone" class="eyebrow mt-4">{kicker}</p><p data-if="tone" class="eyebrow mt-4" style="color:var(--{tone});">{kicker}</p><h1 class="h1 mt-2">{heading}</h1><p class="mt-3" style="font-size:15.5px;line-height:1.55;color:var(--ink-2);max-width:520px;">{lede}</p></div></template>
</head>
<body data-component="transform-hero" data-group="Heroes">

<div class="cells">
  <c-transform-hero from="🫙" to="🥞" tint="plain" tone="cat-grain-fg" kicker="Discard → breakfast" heading="Never throw discard out again." lede="Tangy, tender pancakes in 15 minutes. Uses the 100 g of starter you'd normally toss." arrow="icon" class="w-[1100px]"></c-transform-hero>
  <c-transform-hero from="🌾" to="🫓" tint="grain" tone="cat-grain-fg" kicker="Dough → chapati" heading="Soft chapati that puffs." lede="Whole wheat, water, salt — that's it. The puff comes from technique, not ingredients." arrow="icon" class="w-[1100px]"></c-transform-hero>
  <c-transform-hero from="🌾" to="🍕" tint="spice" tone="accent-700" kicker="Dough → pizza base" heading="Blistered crust, home oven." lede="Maida + water + yeast + salt + olive oil. One-hour rise. Oven at max, preheated pan." arrow="icon" class="w-[1100px]"></c-transform-hero>
  <c-transform-hero from="🍵" to="🫙" tint="fruit" tone="accent-700" kicker="First ferment" heading="Brew the base kombucha." lede="Sweet tea + SCOBY + starter liquid. Sit for 7–14 days. That's a whole brew." arrow="icon" class="w-[1100px]"></c-transform-hero>
  <c-transform-hero tint="none" from="🫙" to="🫚" tone="cat-grain-fg" kicker="Second ferment" heading="Spicy ginger fizz." lede="The gut-shot classic — potent, gingery, aggressive fizz. Small bottles work best." style="background:linear-gradient(135deg,var(--wash-legume),var(--wash-legume-2));" arrow="icon" class="w-[1100px]"></c-transform-hero>
  <c-transform-hero from="🫙" to="🌿" tint="herb" tone="brand-700" kicker="Second ferment" heading="Herb-infused kombucha." lede="Subtle, grown-up, aromatic. Mint · basil · tulsi · lavender · rosemary." arrow="icon" class="w-[1100px]"></c-transform-hero>
  <c-transform-hero arrow="text" from="🥛" to="🍶" tint="plain" kicker="Milk → curd (dahi)" heading="Set curd overnight." lede="Warm milk + a spoon of live culture + a warm spot to sleep. That's it." class="w-[1100px]"></c-transform-hero>
  <c-transform-hero tint="none" arrow="text" from="🥛" to="🧈" tone="highlight-700" kicker="Milk → butter (makhan)" heading="Churn cream until it splits." lede="Skim the top layer off milk/curd for a few days → whip in a stand mixer → butter and buttermilk part ways." style="background:linear-gradient(135deg,var(--highlight-100),var(--highlight-400));" class="w-[1100px]"></c-transform-hero>
  <c-transform-hero arrow="text" from="🥛" to="🍮" tint="fruit" tone="accent-700" kicker="Milk → khoya (mawa)" heading="Reduce milk to a soft dough." lede="Slow simmer for 2 hours, stir constantly at the end. The base of most Indian sweets." class="w-[1100px]"></c-transform-hero>
  <c-transform-hero arrow="text" from="🥛" to="🧀" tint="dairy" tone="cat-dairy" kicker="Milk → paneer" heading="Make paneer in 30 minutes." lede="Split milk with an acid, drain, press. That's the whole thing." class="w-[1100px]"></c-transform-hero>
</div>

</body>
</html>
