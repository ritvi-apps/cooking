<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — IngTile</title>
  <script src="../../shell.js" data-view="components"></script>
<template><a class="ing-tile"><div class="glyph {cat=dairy? glyph-dairy}{cat=grain? glyph-grain}{cat=herb? glyph-herb}{cat=legume? glyph-legume}{cat=spice? glyph-spice}{cat=vegetable? glyph-vegetable}">{glyph}</div><div class="label">{label}</div><div data-if="sub" class="sub">{sub}</div></a></template>
<template state="picked"><button class="ing-tile" style="border-color:var(--brand-500);box-shadow:0 0 0 3px var(--brand-100);"><div class="glyph {cat=dairy? glyph-dairy}{cat=grain? glyph-grain}{cat=herb? glyph-herb}{cat=legume? glyph-legume}{cat=spice? glyph-spice}{cat=vegetable? glyph-vegetable}">{glyph}</div><div class="label">{label}</div><div data-if="sub" class="sub">{sub}</div></button></template>
</head>
<body data-component="ing-tile" data-group="Cards">

<div class="cells">
  <c-ing-tile cat="spice" glyph="🍅" label="Tomato" sub="7 chapters" href="#" class="w-[360px]"></c-ing-tile>
  <c-ing-tile cat="dairy" glyph="🥛" label="Milk" sub="7 chapters" href="#" class="w-[360px]"></c-ing-tile>
  <c-ing-tile cat="grain" glyph="🌾" label="Wheat" sub="7 chapters" href="#" class="w-[360px]"></c-ing-tile>
  <c-ing-tile cat="legume" glyph="🫙" label="Sourdough" sub="7 chapters" href="#" class="w-[360px]"></c-ing-tile>
  <c-ing-tile cat="vegetable" glyph="🥬" label="Spinach" sub="7 chapters" href="#" class="w-[360px]"></c-ing-tile>
  <c-ing-tile cat="herb" glyph="🧄" label="Garlic" sub="aromatic · 1 recipe" href="#" class="w-[360px]"></c-ing-tile>
  <c-ing-tile state="picked" cat="spice" glyph="🍅" label="Tomato" sub="selected" class="w-[360px]"></c-ing-tile>
</div>

</body>
</html>
