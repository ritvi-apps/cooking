<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — Step</title>
  <script src="../../shell.js" data-view="components"></script>
<template><div class="step"><div class="numeral">{n}</div><div><p class="head">{head} <span data-if="icon" style="vertical-align:-3px;color:var(--{tone});"><i data-lucide="{icon}" class="hb-icon w-[20px] h-[20px]" stroke-width="1.75"></i></span></p><p class="cue">{cue}</p><div data-if="meta" class="meta"><slot></slot></div></div></div></template>
</head>
<body data-component="step" data-group="Cards">

<div class="cells">
  <c-step n="1" head="Mix & shaggy" icon="soup" tone="ink-2" cue="Atta + salt + a tsp of ghee. Add water bit by bit until it just holds." meta class="w-[360px]"><c-chip tone="plain" icon="clock">3 min</c-chip></c-step>
</div>

</body>
</html>
