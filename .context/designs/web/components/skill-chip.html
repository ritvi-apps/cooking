<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — SkillChip</title>
  <script src="../../shell.js" data-view="components"></script>
<template><span class="chip chip-brand"><span><i data-lucide="check" class="hb-icon w-[12px] h-[12px]" stroke-width="1.75"></i></span>solid</span></template>
<template skill="learning"><span class="chip chip-highlight"><span><i data-lucide="hourglass" class="hb-icon w-[12px] h-[12px]" stroke-width="1.75"></i></span>learning</span></template>
<template skill="todo"><span class="chip"><span><i data-lucide="dot" class="hb-icon w-[10px] h-[10px]" stroke-width="1.75"></i></span>todo</span></template>
</head>
<body data-component="skill-chip" data-group="Chips">

<div class="cells">
  <c-skill-chip skill="solid"></c-skill-chip>
  <c-skill-chip skill="learning"></c-skill-chip>
  <c-skill-chip skill="todo"></c-skill-chip>
</div>

</body>
</html>
