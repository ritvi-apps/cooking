<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — IdeaCard</title>
  <script src="../../shell.js" data-view="components"></script>
<template><div class="card p-4"><span style="font-size:{size=lg?28:26}px;">{glyph}</span><p class="font-display mt-2" style="font-size:{size=sm?15:16}px;font-weight:600;color:var(--ink);letter-spacing:-0.01em;">{heading}</p><p style="font-size:12.5px;color:var(--ink-2);line-height:1.5;">{text}</p></div></template>
</head>
<body data-component="idea-card" data-group="Cards">

<div class="cells">
  <c-idea-card size="sm" glyph="🛒" heading="Buy" text="Whole seeds only. Sniff test." class="w-[360px]"></c-idea-card>
  <c-idea-card size="lg" glyph="🥔" heading="Aloo paratha" text="Stuffed with spiced potato." class="w-[360px]"></c-idea-card>
  <c-idea-card size="md" glyph="🍋" heading="Lemon" text="Softest texture. Slight citrus note. My default." class="w-[360px]"></c-idea-card>
</div>

</body>
</html>
