<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — ColCap</title>
  <script src="../../shell.js" data-view="components"></script>
<template><div class="col-cap {tone=good?good:bad}"><span><i data-lucide="{icon}" class="hb-icon w-[12px] h-[12px]" stroke-width="1.75"></i></span><slot></slot></div></template>
</head>
<body data-component="col-cap" data-group="Data">

<div class="cells">
  <c-col-cap tone="good" icon="circle-check">GOOD</c-col-cap>
  <c-col-cap tone="bad" icon="circle-x">BAD</c-col-cap>
</div>

</body>
</html>
