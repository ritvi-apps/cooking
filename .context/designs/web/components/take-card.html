<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hamburg — TakeCard</title>
  <script src="../../shell.js" data-view="components"></script>
</head>
<body data-component="take-card" data-group="Cards">

<div class="cells">
  <c-take-card tone="good" label="Good for" class="w-[360px]">
        <li>✓ Gut-friendly (jeera water)</li>
        <li>✓ Warms any savoury dish</li>
        <li>✓ Whole seeds keep 1 year</li>
        <li>✓ Iron-rich, cheap</li>
      </c-take-card>
  <c-take-card tone="watch" label="Watch out" class="w-[360px]">
        <li>✗ Pre-ground goes flat fast</li>
        <li>✗ Burnt cumin turns bitter (10 sec too long)</li>
        <li>✗ Easy to confuse with caraway visually</li>
        <li>✗ Overpowers if overused</li>
      </c-take-card>
</div>

</body>
</html>
