canon: 6.5.0
kind: content
# Standards imported from canon by name; `canon standards` lists them.
standards: [design-sets]
modules:
  - docs
  - knowledge
  - design
  - refs

# The stages this product's work goes through, in order (`canon pipeline`).
# `canon flow` counts how far each conversation got against these.
pipelines:
  default:
    - { id: problem }
    - { id: options, done: [.context/README.md] }
    - { id: research, done: [.context/raw, .context/wiki/synthesis] }
    - { id: design, done: [.context/designs] }
    - { id: marketing, by: agent, optional: true, done: [.context/marketing], prompt: "Read the context file in the marketing folder under .context, if there is one. Draft what this work needs in that folder. Claim only what the product does today. A person publishes it." }
features:
  - process
  - knowledge
  - routing
